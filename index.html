<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Embedded Systems Revision Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        ⚡ Embedded Systems
        <span>Revision Hub</span>
    </div>

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search topics..."
    >

</header>


<main class="layout">

    <!-- LEFT SIDE -->
    <aside class="sidebar">

        <h2>📚 Topics</h2>

        <div id="topics"></div>

    </aside>


    <!-- RIGHT SIDE -->
    <section class="content">

        <div id="topic-details">

            <div class="welcome-message">

                <div class="welcome-icon">⚡</div>

                <h2>Welcome to Embedded Systems Revision Hub</h2>

                <p>
                    Select a topic from the left to start learning.
                </p>

                <p>
                    Learn the concept, understand it with
                    real-life examples and see how it is used
                    in Embedded Systems.
                </p>

            </div>

        </div>

    </section>

</main>


<footer>
    ⚡ Embedded Systems Revision Hub
</footer>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- BACKUP DATA -->
<script src="data.js"></script>

<!-- MAIN SCRIPT -->
<script src="script.js"></script>

</body>
</html>
