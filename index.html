<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Embedded Systems Revision</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚀 Embedded Systems Revision</h1>
        <p>From Basics to Advanced</p>
    </header>

    <main>

        <section class="intro-section">
            <h2>📚 My Embedded Systems Learning</h2>
            <p>
                Learn, revise, search, and test your Embedded Systems knowledge.
            </p>
        </section>


        <!-- SEARCH -->
        <section>
            <h2>🔍 Search Your Revision Notes</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search topics, categories, keywords..."
            >
            <!-- CATEGORY FILTER -->

            <div class="category-section">

                <h3>📂 Categories</h3>

                <div id="category-buttons"></div>

            </div>

        </section>


        <!-- TOPIC LIST -->
        <section>
            <h2>📅 Browse Topics</h2>

            <div id="topics"></div>
        </section>


        <!-- SELECTED TOPIC -->
        <section id="details-section">

            <h2>📖 Revision Notes</h2>

            <div id="topic-details">
                <!-- Selected topic will appear here -->
            </div>

        </section>

    </main>


    <footer>
        <p>Embedded Systems Learning 🚀</p>
    </footer>


    <!-- IMPORTANT: DATA FIRST -->
    <script src="data.js"></script>

    <!-- WEBSITE LOGIC SECOND -->
    <script src="script.js"></script>

</body>

</html>
